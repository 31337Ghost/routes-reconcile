services:
  route-reconcile:
    image: ghcr.io/31337ghost/routes-reconcile:latest
    container_name: routes-reconcile
    restart: unless-stopped
    environment:
      MT_HOST: ${MT_HOST}
      MT_USER: ${MT_USER}
      MT_PASS: ${MT_PASS}
      MT_USE_SSL: ${MT_USE_SSL:-true}
      MT_SSL_VERIFY: ${MT_SSL_VERIFY:-false}
      MT_PORT: ${MT_PORT:-8729}
      MT_WG_GW: ${MT_WG_GW:-wg0}
      MT_DOMAINS: ${MT_DOMAINS:-}
      MT_RESOLVERS: ${MT_RESOLVERS:-8.8.8.8,1.1.1.1}
      MT_ECS_SUBNETS: ${MT_ECS_SUBNETS:-77.88.8.0/24,178.176.0.0/24,85.26.128.0/24,31.173.0.0/24,213.59.0.0/24}
      MT_EXPAND_PREFIXES: ${MT_EXPAND_PREFIXES:-true}
      MT_EXPAND_MIN_PREFIXLEN: ${MT_EXPAND_MIN_PREFIXLEN:-24}
      MT_DRY_RUN: ${MT_DRY_RUN:-false}
      MT_STALE_AFTER_HOURS: ${MT_STALE_AFTER_HOURS:-48}
    volumes:
      - ./.state:/state
